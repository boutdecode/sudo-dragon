name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not an ancestor of main"; exit 1; }

  build:
    needs: [ci, verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          LDFLAGS: -s -w -X github.com/kevin/ascii-adventure/internal/version.Version=${{ github.ref_name }}
        run: |
          name="sudo-dragon_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/$name/sudo-dragon-server" ./cmd/server
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/$name/sudo-dragon" ./cmd/client
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/$name/sudo-dragon-bot" ./cmd/bot
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/$name/sudo-dragon-worldview" ./cmd/worldview
          cp README.md FEATURES.md "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          rm -rf "$name"
      - name: Smoke test (--version)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          tar -xzf dist/*.tar.gz -C dist
          out="$(dist/sudo-dragon_*/sudo-dragon-server --version)"
          echo "$out"
          case "$out" in *"$GITHUB_REF_NAME"*) ;; *) echo "::error::version not stamped"; exit 1 ;; esac
          rm -rf dist/sudo-dragon_*/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags --generate-notes --title "$GITHUB_REF_NAME" dist/*
